services:
  - type: web
    name: conza
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: conza-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: conza-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: conza-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: conza-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: conza-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: LABYRINTHE_API_URL
        sync: false
      - key: LABYRINTHE_API_TOKEN
        sync: false
      - key: LABYRINTHE_CURRENCY
        value: CDF
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: conza-db
    plan: free